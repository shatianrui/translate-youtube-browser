name: Build IPA

on:
  push:
    branches: [ main, master, "cursor/**" ]
    paths:
      - "TranslateBrowser/**"
      - "project.yml"
      - "scripts/build-ipa.sh"
      - ".github/workflows/build-ipa.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - "TranslateBrowser/**"
      - "project.yml"
      - "scripts/build-ipa.sh"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        type: choice
        options: [ Release, Debug ]
        default: Release

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史,供构建脚本推导版本号(git tag / 提交数)
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        id: build
        run: scripts/build-ipa.sh all

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.ipa-name }}
          path: |
            ${{ steps.build.outputs.ipa-path }}
            ${{ steps.build.outputs.ipa-path }}.sha256
          retention-days: 14
          if-no-files-found: error
