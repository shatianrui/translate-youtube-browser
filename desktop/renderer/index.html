<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:; connect-src https: http:; media-src * blob:;">
  <title>译览</title>
  <link rel="stylesheet" href="workspace.css" />
</head>
<body>
  <main class="workspace">
    <header class="masthead">
      <div>
        <p class="eyebrow">STANDALONE CAPTION WORKSPACE</p>
        <h1>译览字幕台</h1>
        <p class="subhead">提取 YouTube 字幕，离线查看并翻译。无需打开内置浏览器。</p>
      </div>
      <button id="btnSettings" class="button quiet">翻译设置</button>
    </header>

    <section class="source-card">
      <label for="videoUrl">YouTube 视频链接</label>
      <div class="link-row">
        <input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false" />
        <button id="btnFetch" class="button primary">获取字幕</button>
      </div>
      <p id="status" class="status" role="status">粘贴视频链接以开始。</p>
    </section>

    <section class="control-bar">
      <label>字幕轨 <select id="trackSelect" disabled></select></label>
      <button id="btnLoadTrack" class="button" disabled>载入此轨</button>
      <span class="divider"></span>
      <button id="btnTranslate" class="button primary" disabled>翻译全部</button>
      <button id="btnExportSrt" class="button" disabled>导出 SRT</button>
      <button id="btnExportTxt" class="button" disabled>导出 TXT</button>
      <span id="count" class="count">0 条字幕</span>
    </section>

    <section id="subtitleList" class="subtitle-list" aria-live="polite">
      <div class="empty">字幕会显示在这里。翻译将保留原文和对应时间轴。</div>
    </section>
  </main>

  <!-- Settings modal -->
  <dialog id="settingsDialog" class="modal">
    <form method="dialog" id="settingsForm" class="modal-card">
      <h2>设置</h2>
      <label>
        翻译服务商
        <select id="settingProvider"></select>
      </label>
      <label>
        API Key
        <input id="settingApiKey" type="password" autocomplete="off" placeholder="sk-..." />
      </label>
      <label>
        模型（可留空使用默认）
        <input id="settingModel" type="text" autocomplete="off" />
      </label>
      <label>
        目标语言
        <select id="settingTargetLang">
          <option>中文</option>
          <option>English</option>
          <option>日本語</option>
          <option>한국어</option>
          <option>Français</option>
          <option>Deutsch</option>
          <option>Español</option>
          <option>Русский</option>
          <option>繁體中文</option>
        </select>
      </label>
      <p class="hint">打开 YouTube 视频后会自动提取字幕，并在画面内叠加原文 + 译文。API Key 仅保存在本机。</p>
      <div class="modal-actions">
        <button type="submit" value="cancel" class="btn ghost">取消</button>
        <button type="submit" value="save" class="btn primary" id="settingsSave">保存</button>
      </div>
    </form>
  </dialog>

  <script src="workspace.js" type="module"></script>
</body>
</html>
